[project]
name = "uxflow"
version = "0.1.0"
description = "SWE trajectory selector for SFT dataset curation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "dengxuanliang"}]

dependencies = [
    "httpx>=0.27",
    "datasketch>=1.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0", "torch>=2.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "python-dotenv", "ruff"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.urls]
Repository = "https://github.com/dengxuanliang/uxflow"
Issues = "https://github.com/dengxuanliang/uxflow/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway", "src/module0", "src/module1", "src/module2", "src/module3", "src/uxflow_embed", "src/module0_5", "src/service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_model: needs local Qwen model + torch (skipped in CI)",
]
