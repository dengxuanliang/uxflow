[project]
name = "llm-gateway"
version = "0.1.0"
description = "Adaptive LLM call gateway with circuit breaker, rate limiting, and truncation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "python-dotenv",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway", "src/module0", "src/module1", "src/module2", "src/module3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_model: needs local Qwen model + torch (skipped in CI)",
]
